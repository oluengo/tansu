<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tansu · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f7f7f4; --card:#fff; --ink:#1e2230; --muted:#6b7080; --line:#e7e6e1;
  --accent:#3d4fa8; --accent-soft:#eceffa; --wood:#b07a4a; --ok:#2e8a5a; --warn:#b5651d; --danger:#c0392b;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 120px}
.switch{display:flex;gap:6px;background:#ecebe6;border-radius:999px;padding:4px;margin:4px 0 14px}
.switch button{flex:1;padding:8px 10px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.switch button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* app chrome */
.app{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 2px 12px rgba(20,20,40,.05)}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.top .logo{width:32px;height:32px;flex:none}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sp{flex:1}
.acct{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;max-width:52%}
.acct span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.search{display:flex;align-items:center;gap:8px;margin:10px 14px 4px;padding:9px 12px;background:var(--bg);border-radius:12px}
.search input{border:0;background:none;outline:0;font:inherit;flex:1;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 14px 4px;font-size:13px;color:var(--muted)}
.crumbs button{padding:2px 6px;border-radius:6px}
.crumbs button:hover{background:var(--bg)}
.crumbs .cur{color:var(--ink);font-weight:600}
.list{padding:4px 6px 10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 10px;border-radius:12px}
.row:hover{background:var(--bg)}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.ico.f{background:#f5ecdf;color:var(--wood)}
.ico svg{width:20px;height:20px}
.row .t{flex:1;min-width:0}
.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#b5b5b0}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.badge.lock{background:#fff4e6;color:var(--warn)}
.badge.dirty{background:#fdecea;color:var(--danger)}
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:14px 12px 4px}
/* detail */
.det{padding:6px 14px 16px}
.det h2{margin:6px 0 2px;font-size:20px;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.box{border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
.box .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fbfbf9;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.box .hd .sp{flex:1}
.it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.tag{font:600 11px/1 ui-monospace,Menlo,monospace;padding:4px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);flex:none;min-width:34px;text-align:center}
.it .v{flex:1;min-width:0;font-size:14px}
.it .v small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .v div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{padding:4px 8px;border-radius:8px;color:var(--muted)}
.dots:hover{background:var(--bg)}
.locked{padding:18px 12px;text-align:center;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:11px;font-weight:600;font-size:14px;background:var(--bg)}
.btn.p{background:var(--accent);color:#fff}
.btn.d{color:var(--danger)}
.btn.s{padding:6px 10px;font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
pre,textarea{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0;padding:12px;white-space:pre-wrap;word-break:break-word}
textarea{width:100%;min-height:260px;border:0;outline:0;resize:vertical;background:#fcfcfb}
.err{color:var(--danger);font-size:13px;padding:6px 12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* bottom bar & sheets */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(732px,calc(100% - 28px));background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:5}
.bar .sp{flex:1;font-size:14px}
.bar .btn{background:#fff;color:var(--ink)}
.bar .btn.g{background:transparent;color:#cfd2dc}
.shade{position:fixed;inset:0;background:rgba(20,20,30,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:min(760px,100%);border-radius:20px 20px 0 0;padding:16px 16px 26px;max-height:85vh;overflow:auto}
.sheet h3{margin:2px 0 10px;font-size:17px}
.sheet .row{padding:12px 8px}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.spin{width:16px;height:16px;border:2px solid #ccd;border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
/* name & icon page */
.page h2{font-size:18px;margin:18px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.cand{display:flex;gap:14px;align-items:flex-start}
.cand .k{font:500 26px/1 "Noto Sans JP",sans-serif;color:var(--wood);width:64px;flex:none;text-align:center;padding-top:4px}
.cand h4{margin:0 0 2px;font-size:16px}
.cand p{margin:2px 0;color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:6px}
.pill.g{background:#e7f5ee;color:var(--ok)} .pill.y{background:#fff4e6;color:var(--warn)} .pill.r{background:#fdecea;color:var(--danger)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.icons .card{text-align:center;margin:0;cursor:pointer;border-width:2px}
.icons .card.on{border-color:var(--accent)}
.icons svg{width:96px;height:96px}
.icons b{display:block;margin-top:8px}
.icons small{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
</style>
</head>

  ev({kind:10002,cat:'list',updated:d(80),pub:[['r','wss://relay.damus.io'],['r','wss://nos.lol']]}),
  ev({kind:30063,cat:'set',d:'wavestr-1.0.0',title:'Release 1.0.0',updated:d(150),pub:[['i','io.github.oluengo.wavestr'],['version','1.0.0']]}),
 ]},
];
KINDS[30063]='Release (Zapstore)';

/* ---------- state ---------- */
let chosenIcon='c';
let S={acc:'a1',path:[],ev:null,q:'',editing:false,err:'',pending:[]};
const acc=()=>accounts.find(a=>a.id===S.acc);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const h=(now-t)/3600e3;return h<1?'hace un momento':h<24?`hace ${Math.round(h)} h`:`hace ${Math.round(h/24)} d`};
const evName=e=>e.title||KINDS[e.kind]||('kind '+e.kind);
const count=e=>e.json?Object.keys(e.json).length+' claves':((e.pub||[]).length+(e.priv||[]).length)+' elementos';
const TAGN={p:'persona',e:'nota',a:'evento',t:'hashtag',r:'relay',relay:'relay',word:'palabra',server:'servidor',i:'id',version:'versión'};

function toast(m,ms=1800){const t=document.createElement('div');t.className='toast';t.innerHTML=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function mark(e,desc){e.dirty=true;e.updated=Date.now();S.pending.push({acc:S.acc,ev:e.id,desc});renderBar()}

/* ---------- render ---------- */
function render(){
  const a=acc();
  let h=`<div class="app">
  <div class="top"><div class="logo">${LOGO()}</div><h1>Tansu</h1><div class="sp"></div>
   <button class="acct" onclick="sheetAccounts()"><div class="av" style="background:${a.color}">${a.name[0]}</div><span>${esc(a.name)}</span></button><button class="dots" title="Ajustes" onclick="sheetSettings()">⚙</button></div>
  <label class="search">${I.search}<input id="q" placeholder="Buscar en listas y datos de apps" value="${esc(S.q)}" oninput="S.q=this.value;renderBody()"></label>
  <div id="body"></div></div>`;
  $('#demo').innerHTML=h; renderBody(); renderBar();
}
function crumbs(){
  const a=acc(), p=S.path, parts=[[a.name,[]]];
  if(p[0]) parts.push([{list:'Listas',set:'Conjuntos',app:'Datos de apps'}[p[0]],[p[0]]]);
  if(p[1]) parts.push([APPS[p[1]]?.name||'Otras',[p[0],p[1]]]);
  let h='<div class="crumbs">';
  parts.forEach((x,i)=>{const last=i===parts.length-1&&!S.ev;h+=(i?'<span>›</span>':'')+`<button class="${last?'cur':''}" onclick='go(${JSON.stringify(x[1])})'>${esc(x[0])}</button>`});
  if(S.ev){const e=find(S.ev);h+=`<span>›</span><span class="cur">${esc(evName(e))}</span>`}
  return h+'</div>';
}
function go(p){S.path=p;S.ev=null;S.editing=false;S.err='';renderBody();window.scrollTo(0,0)}
function find(id){for(const a of accounts)for(const e of a.events)if(e.id===id)return e}
function evRow(e){
  const ic=e.json?I.code:I.list;
  return `<button class="row" onclick="openEv('${e.id}')"><div class="ico">${ic}</div><div class="t"><div class="n">${esc(evName(e))}</div>
  <div class="m">kind ${e.kind}${e.d?' · '+esc(e.d):''} · ${count(e)} · ${ago(e.updated)}</div></div>
  ${e.dirty?'<span class="badge dirty">sin publicar</span>':e.enc?'<span class="badge lock">🔒 '+e.enc+'</span>':''}<span class="chev">${I.chev}</span></button>`;
}
function folderRow(name,meta,p,color){
  return `<button class="row" onclick='go(${JSON.stringify(p)})'><div class="ico f" ${color?`style="background:${color}1a;color:${color}"`:''}>${I.folder}</div><div class="t"><div class="n">${esc(name)}</div><div class="m">${meta}</div></div><span class="chev">${I.chev}</span></button>`;
}
function renderBody(){
  const a=acc(), E=a.events, b=$('#body'); if(!b)return;
  if(S.q.trim()){
    const q=S.q.toLowerCase();
    const r=E.filter(e=>(evName(e)+' '+(e.d||'')+' '+e.kind+' '+JSON.stringify(e.pub||[])+' '+(e.unlocked||!e.enc?JSON.stringify(e.priv||e.json||''):'')).toLowerCase().includes(q));
    b.innerHTML=`<div class="sec">${r.length} resultado${r.length==1?'':'s'}</div><div class="list">${r.map(evRow).join('')||'<div class="empty">Nada por aquí. Lo cifrado solo se busca tras descifrarlo.</div>'}</div>`;return;
  }
  if(S.ev){b.innerHTML=crumbs()+detail(find(S.ev));return}
  const p=S.path; let h=crumbs()+'<div class="list">';
  if(!p.length){
    const L=E.filter(e=>e.cat=='list'),St=E.filter(e=>e.cat=='set'),Ap=E.filter(e=>e.cat=='app');
    h+=folderRow('Datos de apps',`${Ap.length} · copias y ajustes (NIP-78)`,['app']);
    h+=folderRow('Listas',`${L.length} · solo lectura (NIP-51)`,['list']);
    h+=folderRow('Conjuntos',`${St.length} · solo lectura (NIP-51)`,['set']);
    h+=`</div><p class="note" style="padding:0 14px">Tansu nunca publica nada legible: todo lo que escribe va cifrado (NIP-44) para tu propia cuenta.</p><div class="sec">Recientes</div><div class="list">${[...E].sort((x,y)=>y.updated-x.updated).slice(0,3).map(evRow).join('')}`;
  } else if(p[0]=='app'&&!p[1]){
    const Ap=E.filter(e=>e.cat=='app'), groups={};
    Ap.forEach(e=>{const k=e.app||'_';(groups[k]=groups[k]||[]).push(e)});
    Object.keys(groups).sort((x,y)=>x=='_'?1:y=='_'?-1:0).forEach(k=>{const g=groups[k];
      h+=folderRow(k=='_'?'Otras apps':APPS[k].name,`${g.length} archivo${g.length>1?'s':''} · ${ago(Math.max(...g.map(e=>e.updated)))}`,['app',k],k=='_'?null:APPS[k].color)});
    if(!Ap.length)h+='<div class="empty">Esta cuenta no tiene datos de apps.</div>';
  } else {
    const r=E.filter(e=>e.cat==p[0]&&(p[0]!='app'||(e.app||'_')==p[1]));
    h+=r.map(evRow).join('')||'<div class="empty">Vacío.</div>';
  }
  b.innerHTML=h+'</div>';
}
function itemRow(e,t,i,priv){
  const label=t[2]||'';
  return `<div class="it"><span class="tag">${esc(t[0])}</span><div class="v"><div>${esc(label||t[1])}</div><small>${esc(label?t[1]:(TAGN[t[0]]||''))}${t[0]=='r'&&t[2]&&!['read','write'].includes(t[2])?'':''}</small></div>
  <button class="dots" onclick="sheetItem('${e.id}',${priv},${i})">•••</button></div>`;
}
function detail(e){
  let h=`<div class="det"><h2>${esc(evName(e))}</h2><div class="meta">
   <span class="badge">kind ${e.kind} · ${KINDS[e.kind]||''}</span>${e.d?`<span class="badge">d: ${esc(e.d)}</span>`:''}
   <span class="badge">${ago(e.updated)}</span><span class="badge">en ${e.relays} relays</span>${e.enc?`<span class="badge lock">🔒 ${e.enc}</span>`:''}${e.dirty?'<span class="badge dirty">sin publicar</span>':''}</div>`;
  const locked=e.enc&&!e.unlocked;
  if(e.json){
    h+=`<div class="box"><div class="hd">${locked?'🔒 Contenido cifrado':'Contenido (JSON)'}<div class="sp"></div>${!locked&&!S.editing?`<button class="btn s" onclick="S.editing=true;renderBody()">Editar</button>`:''}</div>`;
    if(locked) h+=`<div class="locked">Cifrado para ti. Lo descifra tu firmante, la app no ve tu nsec.<br><br><button class="btn p" onclick="unlock('${e.id}')">Descifrar con ${acc().signer.split(' ')[0]}</button></div>`;
    else if(S.editing) h+=`<textarea id="ta" spellcheck="false">${esc(JSON.stringify(e.json,null,2))}</textarea>${S.err?`<div class="err">${esc(S.err)}</div>`:''}<div style="padding:10px 12px;display:flex;gap:8px;border-top:1px solid var(--line)"><button class="btn p s" onclick="saveJson('${e.id}')">Guardar</button><button class="btn s" onclick="S.editing=false;S.err='';renderBody()">Cancelar</button></div>`;
    else h+=`<pre>${esc(JSON.stringify(e.json,null,2))}</pre>`;
    h+='</div>';
  } else {
    h+=`<div class="box"><div class="hd">Públicos <span class="badge">${(e.pub||[]).length}</span><div class="sp"></div></div>${(e.pub||[]).map((t,i)=>itemRow(e,t,i,false)).join('')||'<div class="locked">Sin elementos públicos</div>'}</div>`;
    if(e.priv||e.enc){
      h+=`<div class="box"><div class="hd">🔒 Privados ${locked?'':`<span class="badge">${(e.priv||[]).length}</span>`}<div class="sp"></div></div>`;
      h+=locked?`<div class="locked">Elementos cifrados en <code>content</code>.<br><br><button class="btn p" onclick="unlock('${e.id}')">Descifrar con ${acc().signer.split(' ')[0]}</button></div>`:((e.priv||[]).map((t,i)=>itemRow(e,t,i,true)).join('')||'<div class="locked">Sin elementos privados</div>');
      h+='</div>';
    }
  }
  h+=`<div class="acts"><button class="btn" onclick="sheetCopy('${e.id}')">Copiar a otra cuenta</button><button class="btn" onclick="exportEv('${e.id}')">Copiar JSON del evento</button>${e.json&&!e.enc?'':`<button class="btn" onclick="toast('Archivo guardado')">Exportar archivo</button>`}<button class="btn d" onclick="sheetDelete('${e.id}')">Eliminar…</button></div></div>`;
  return h;
}
function renderBar(){
  const n=S.pending.length,b=$('#bar');
  b.innerHTML=n?`<div class="bar"><div class="sp">${n} cambio${n>1?'s':''} sin publicar</div><button class="btn g s" onclick="sheetPending()">Revisar</button><button class="btn s" onclick="publish()">Firmar y publicar</button></div>`:'';
}

/* ---------- actions ---------- */
function openEv(id){S.ev=id;S.q='';const q=$('#q');if(q)q.value='';S.editing=false;S.err='';renderBody();window.scrollTo(0,0)}
function unlock(id){const e=find(id);const signer=acc().signer.split(' ')[0];
  if(signer==='Solo'){toast('Cuenta de solo lectura: no se puede descifrar');return}
  toast(`<span class="spin"></span> Pidiendo a ${signer} que descifre…`,900);
  setTimeout(()=>{e.unlocked=true;renderBody()},900)}
function saveJson(id){const e=find(id);try{const v=JSON.parse($('#ta').value);e.json=v;S.editing=false;S.err='';mark(e,`Editado ${evName(e)}`);renderBody()}catch(x){S.err='JSON no válido: '+x.message;renderBody()}}
function exportEv(id){const e=find(id);const o={kind:e.kind,tags:[...(e.d?[['d',e.d]]:[]),...(e.pub||[])],content:e.enc?'<cifrado '+e.enc+'>':JSON.stringify(e.json||'')};
  try{navigator.clipboard.writeText(JSON.stringify(o,null,2)).then(()=>toast('JSON copiado'),()=>toast('No se pudo copiar'))}catch(x){toast('No se pudo copiar')}}
function publish(){const n=S.pending.length;const ro=S.pending.some(p=>accounts.find(a=>a.id===p.acc).signer==='Solo lectura');
  if(ro){toast('Hay cambios en una cuenta de solo lectura');return}
  toast(`<span class="spin"></span> Firmando ${n} evento${n>1?'s':''}…`,1100);
  setTimeout(()=>{S.pending.forEach(p=>{const e=find(p.ev);if(e){e.dirty=false}});S.pending=[];renderBar();renderBody();toast('✓ Publicado en 4 relays')},1100)}

/* ---------- sheets ---------- */
function sheetSettings(){sheet(`<h3>Ajustes</h3>
 <div class="sec">Cuentas</div>${accounts.map(a=>`<div class="it"><div class="av" style="background:${a.color}">${a.name[0]}</div><div class="v"><div>${esc(a.name)}</div><small>${a.npub} · ${a.signer}</small></div><button class="btn s">Renombrar</button><button class="btn s d">Quitar</button></div>`).join('')}
 <div class="sec">Apariencia e idioma</div><div class="it"><div class="v">Tema</div><span class="badge">Claro</span><span class="badge">Oscuro</span><span class="badge" style="background:var(--accent-soft);color:var(--accent)">Auto</span></div>
 <div class="it"><div class="v">Color de acento</div>${['#3d4fa8','#6d28d9','#0e7c6b','#d9480f','#be185d'].map(c=>`<span style="width:22px;height:22px;border-radius:50%;background:${c};display:inline-block"></span>`).join('')}</div>
 <div class="it"><div class="v">Idioma</div><span class="badge">Idioma del dispositivo · Català · Español · English</span></div>
 <div class="sec">Relays</div><div class="it"><div class="v"><div>Relays de Tansu</div><small>relay.damus.io · nos.lol · relay.primal.net (+ los NIP-65 de cada cuenta)</small></div></div>
 <div class="sec">Papelera</div><div class="it"><div class="v"><div>usus/backup-2026-10-30</div><small>Oscar · hace 2 d · copia local cifrada</small></div><button class="btn s">Restaurar</button></div>
 <div class="sec">Acerca de</div>
 <div class="it"><div style="width:36px;height:36px">${LOGO()}</div><div class="v"><div><b>Tansu</b> versión 0.1.0 beta</div><small>Hecha con IA · probada por humanos · Licencia MIT</small></div></div>
 <div class="it"><div class="v"><div>Código fuente</div><small>github.com/oluengo/tansu</small></div><span>↗</span></div>
 <div class="it"><div class="v"><div>Créditos · Icono de Nostr: Purple Nostrich de SovrynMatt</div><small>github.com/SovrynMatt/Nostr-Website-Button-Design</small></div><span>↗</span></div>
 <div class="it"><div class="av" style="background:#F7931A">₿</div><div class="v"><div>Bitcoin</div><small>bc1pnvdct6hf…8raspa · toca para copiar</small></div></div>
 <div class="it"><div class="av" style="background:#7B3FE4">⚡</div><div class="v"><div>Lightning / zaps</div><small>oluengo@rizful.com · toca para copiar</small></div></div>`)}

function sheet(h){$('#layer').innerHTML=`<div class="shade" onclick="if(event.target===this)closeS()"><div class="sheet">${h}</div></div>`}
function closeS(){$('#layer').innerHTML=''}
function sheetAccounts(){
  sheet(`<h3>Cuentas</h3>${accounts.map(a=>`<button class="row" onclick="S.acc='${a.id}';S.path=[];S.ev=null;closeS();render()"><div class="av" style="background:${a.color};width:36px;height:36px">${a.name[0]}</div><div class="t"><div class="n">${esc(a.name)} ${a.id===S.acc?'✓':''}</div><div class="m">${esc(a.handle)} · ${a.npub} · ${a.signer}</div></div></button>`).join('')}
  <div class="sec">Añadir cuenta</div>
  <button class="row" onclick="closeS();toast('Abriendo Amber…')"><div class="ico">${I.file}</div><div class="t"><div class="n">Amber</div><div class="m">Firmante en este móvil (NIP-55)</div></div></button>
  <button class="row" onclick="closeS();toast('Pega tu bunker:// o escanea el QR')"><div class="ico">${I.file}</div><div class="t"><div class="n">Bunker</div><div class="m">bunker:// o nostrconnect:// (NIP-46)</div></div></button>
  <button class="row" onclick="closeS();toast('Pega una npub para solo lectura')"><div class="ico">${I.file}</div><div class="t"><div class="n">Solo npub</div><div class="m">Ver sin poder descifrar ni editar</div></div></button>
  <p class="note">La app nunca guarda la nsec.</p>`)}
function sheetItem(id,priv,i){const e=find(id),arr=priv?e.priv:e.pub,t=arr[i];
  sheet(`<h3>${esc(t[2]||t[1])}</h3><p class="note">${esc(t[0])} · ${esc(t[1])}</p>
  <button class="row" onclick="sheetEdit('${id}',${priv},${i})">Editar</button>
  <button class="row" onclick="try{navigator.clipboard.writeText('${esc(t[1])}')}catch(x){};closeS();toast('Copiado')">Copiar valor</button>
  <p class="note">Las listas NIP-51 son de solo lectura en esta versión.</p>`)}
function moveItem(id,priv,i){const e=find(id);const from=priv?e.priv:e.pub;const [t]=from.splice(i,1);if(priv)e.pub.push(t);else{(e.priv=e.priv||[]).push(t);e.enc=e.enc||'NIP-44';e.unlocked=true}closeS();mark(e,`${t[2]||t[1]} → ${priv?'público':'privado'}`);renderBody()}
function delItem(id,priv,i){const e=find(id);const [t]=(priv?e.priv:e.pub).splice(i,1);closeS();mark(e,`Quitado ${t[2]||t[1]}`);renderBody()}
function form(id,priv,i){const e=find(id);const t=i==null?['',' ','']:(priv?e.priv:e.pub)[i];
  const tags=['p','e','a','t','r','relay','word','server','i'];
  return `<label class="field"><span>Tipo de etiqueta</span><select id="ft">${tags.map(x=>`<option ${x==t[0]?'selected':''}>${x}</option>`).join('')}</select></label>
  <label class="field"><span>Valor (npub, note, relay, palabra…)</span><input id="fv" value="${esc(t[1].trim())}"></label>
  <label class="field"><span>Etiqueta visible (opcional)</span><input id="fl" value="${esc(t[2]||'')}"></label>
  <button class="btn p" onclick="saveItem('${id}',${priv},${i==null?'null':i})">Guardar</button>`}
function sheetEdit(id,priv,i){sheet('<h3>Editar elemento</h3>'+form(id,priv,i))}
function sheetAdd(id,priv){sheet(`<h3>Añadir ${priv?'elemento privado':'elemento público'}</h3>`+form(id,priv,null))}
function saveItem(id,priv,i){const e=find(id);const v=$('#fv').value.trim();if(!v){toast('Falta el valor');return}
  const t=[$('#ft').value,v];const l=$('#fl').value.trim();if(l)t.push(l);
  const arr=priv?(e.priv=e.priv||[]):e.pub; if(i==null)arr.push(t);else arr[i]=t;closeS();mark(e,`${i==null?'Añadido':'Editado'} ${l||v}`);renderBody()}
function sheetCopy(id){const e=find(id);const others=accounts.filter(a=>a.id!==S.acc);
  sheet(`<h3>Copiar «${esc(evName(e))}» a…</h3>${others.map(a=>`<button class="row" onclick="copyTo('${id}','${a.id}')"><div class="av" style="background:${a.color};width:36px;height:36px">${a.name[0]}</div><div class="t"><div class="n">${esc(a.name)}</div><div class="m">${a.signer}${a.events.some(x=>x.kind==e.kind&&x.d==e.d)?' · ya tiene uno: se reemplazará':''}</div></div></button>`).join('')}
  <p class="note">${e.enc?'Se descifra con tu cuenta y se vuelve a cifrar para la cuenta de destino.':''} Si es reemplazable, el de destino se sobrescribe; antes se guarda una copia local.</p>`)}
function copyTo(id,aid){const e=find(id),a=accounts.find(x=>x.id===aid);
  if(a.signer==='Solo lectura'){toast('Esa cuenta es de solo lectura');return}
  a.events=a.events.filter(x=>!(x.kind==e.kind&&x.d==e.d));const c=ev(JSON.parse(JSON.stringify(e)));c.id='ev'+(uid++);c.unlocked=true;a.events.push(c);
  closeS();const prev=S.acc;S.acc=aid;mark(c,`Copia de ${evName(e)} en ${a.name}`);S.acc=prev;toast(`Copiado a ${a.name} (pendiente de firmar)`)}
function sheetDelete(id){const e=find(id);
  sheet(`<h3>Eliminar «${esc(evName(e))}»</h3><p class="note">Se publica una petición de borrado (NIP-09, kind 5). La mayoría de relays la respetan, pero no todos: puede quedar alguna copia.</p>
  <p class="note">Antes de borrar, Tansu guarda una copia local que podrás restaurar desde la Papelera.</p>
  <div class="acts"><button class="btn d" onclick="doDelete('${id}')">Eliminar</button><button class="btn" onclick="closeS()">Cancelar</button></div>`)}
function doDelete(id){const a=acc();const e=find(id);a.events=a.events.filter(x=>x.id!==id);S.pending=S.pending.filter(p=>p.ev!==id);S.pending.push({acc:S.acc,ev:'del',desc:`Borrar ${evName(e)} (kind 5)`});closeS();go(S.path);renderBar()}
function sheetPending(){sheet(`<h3>Cambios sin publicar</h3>${S.pending.map(p=>`<div class="it"><div class="av" style="background:${accounts.find(a=>a.id===p.acc).color}">${accounts.find(a=>a.id===p.acc).name[0]}</div><div class="v">${esc(p.desc)}</div></div>`).join('')}
  <div class="acts"><button class="btn p" onclick="closeS();publish()">Firmar y publicar</button><button class="btn d" onclick="S.pending=[];closeS();renderBar();toast('Cambios descartados (en la demo siguen en pantalla)')">Descartar todo</button></div>`)}

render();
</script>
