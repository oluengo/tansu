<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tansu · Your private Nostr data, in folders</title>
<meta name="description" content="Tansu: a multi-account file explorer for the private data your Nostr apps keep (Wavestr, Usus… NIP-78 backups and NIP-51 lists). Only ever publishes encrypted. Android and web.">
<meta name="theme-color" content="#F7F7F4">
<link rel="icon" href="favicon-48.png" sizes="48x48">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
	color-scheme: light dark;
	--bg: light-dark(#F7F7F4, #121318);
	--card: light-dark(#FFFFFF, #1A1C22);
	--ink: light-dark(#1E2230, #E8E9EE);
	--muted: light-dark(#6B7080, #9A9EAC);
	--line: light-dark(#E7E6E1, #2A2D36);
	--accent: light-dark(#3D4FA8, #9AA8F0);
	--accent-bg: light-dark(#E9ECF8, #1F2440);
	--wood: light-dark(#B07A4A, #D9A273);
	--wood-bg: light-dark(#F5ECDF, #33281D);
	--cream: #F4F1EA;
	--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
a { color: var(--accent); }
.wrap { max-width: 64rem; margin: 0 auto; padding: 0 1.25rem; }
h1, h2, h3 { line-height: 1.1; letter-spacing: -.02em; margin: 0; }
h2 { font-size: clamp(1.6rem, 3.6vw, 2.2rem); margin-bottom: .5rem; }
.lead { color: var(--muted); font-size: 1.06rem; max-width: 40rem; margin: 0 0 2rem; }
section { padding: 4.5rem 0 0; }
code { font: .86em var(--mono); background: var(--accent-bg); padding: .1rem .35rem; border-radius: 6px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.top .wrap { display: flex; align-items: center; gap: 1rem; height: 4rem; }
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; font-size: 1.15rem; color: inherit; text-decoration: none; }
.brand img { width: 1.9rem; height: 1.9rem; }
.top nav { margin-left: auto; display: flex; align-items: center; gap: .9rem; font-size: .92rem; }
.top nav a { color: var(--muted); text-decoration: none; } .top nav a:hover { color: var(--ink); }
.lang { display: flex; gap: .1rem; font-size: .8rem; }
.lang button, .theme { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; padding: .25rem .4rem; border-radius: 6px; }
.lang button[aria-pressed="true"] { color: var(--ink); font-weight: 600; background: var(--accent-bg); }
.theme svg { width: 1.1rem; height: 1.1rem; display: block; }
/* Solo uno a la vez: luna en claro (pasar a oscuro), sol en oscuro (pasar a claro). */
.theme .i-sun { display: none; }
:root[data-theme="dark"] .theme .i-sun { display: block; }
:root[data-theme="dark"] .theme .i-moon { display: none; }
@media (max-width: 640px) { .top nav .nl { display: none; } }

.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 3rem; align-items: center; padding: 3rem 0 1rem; }
.hero h1 { font-size: clamp(2.3rem, 6vw, 3.6rem); margin: 1rem 0 1rem; }
.hero h1 span { color: var(--accent); }
.hero p { color: var(--muted); font-size: 1.12rem; margin: 0 0 1.6rem; max-width: 34rem; }
.hero .icon { width: 5rem; height: 5rem; }
.cta { display: flex; flex-wrap: wrap; gap: .7rem; }
.btn { display: inline-flex; align-items: center; gap: .5rem; padding: .8rem 1.2rem; border-radius: 14px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); color: var(--ink); background: var(--card); }
.btn.p { background: var(--accent); border-color: var(--accent); color: light-dark(#fff, #0E0F14); }
.btn:hover { filter: brightness(.97); }
.small { font-size: .88rem; color: var(--muted); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; gap: 2rem; } }

/* Maqueta del explorador */
.mock { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: .9rem; box-shadow: 0 18px 50px -24px rgba(30,34,48,.35); font-size: .92rem; }
.mock .bar { display: flex; align-items: center; gap: .5rem; padding: .2rem .3rem .7rem; font-weight: 700; }
.mock .bar img { width: 1.5rem; height: 1.5rem; }
.mock .bar .av { margin-left: auto; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: .75rem; }
.mock .sec { font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: .6rem .4rem .3rem; }
.mock .row { display: flex; align-items: center; gap: .7rem; padding: .55rem .4rem; border-radius: 10px; }
.mock .ico { width: 2.1rem; height: 2.1rem; border-radius: 9px; display: grid; place-items: center; background: var(--wood-bg); color: var(--wood); flex: none; }
.mock .ico.l { background: var(--accent-bg); color: var(--accent); }
.mock .t { flex: 1; min-width: 0; } .mock .n { font-weight: 600; } .mock .m { font-size: .78rem; color: var(--muted); }
.mock .badge { font-size: .68rem; font-weight: 600; padding: .15rem .5rem; border-radius: 99px; background: light-dark(#FFF4E6, #33261A); color: light-dark(#B5651D, #F0A65A); }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1.3rem; }
.card h3 { font-size: 1.08rem; margin: .7rem 0 .35rem; }
.card p { margin: 0; color: var(--muted); font-size: .96rem; }
.card .ic { width: 2.4rem; height: 2.4rem; border-radius: 11px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); font-size: 1.15rem; }
.privacy { background: var(--accent-bg); border-radius: 22px; padding: 2rem; }
.privacy ul { margin: 0; padding-left: 1.2rem; } .privacy li { margin: .4rem 0; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: .8rem; }
.steps li { counter-increment: s; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem 1rem 3.4rem; position: relative; }
.steps li::before { content: counter(s); position: absolute; left: 1rem; top: 1rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--accent); color: light-dark(#fff, #0E0F14); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
footer { margin-top: 5rem; padding: 2rem 0 3rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
footer .wrap { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; align-items: center; }
footer a { color: var(--muted); }
.donate { flex-basis: 100%; display: grid; gap: .6rem; margin-bottom: .6rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: .45rem; font: inherit; font-size: .88rem; font-weight: 600; text-decoration: none; color: var(--ink, var(--fg)); border: 1px solid; border-radius: 999px; padding: .3rem .85rem .3rem .35rem; cursor: pointer; transition: border-color .15s, background .15s; }
.chip svg { width: 1.35rem; height: 1.35rem; flex: none; }
.chip.btc { --c: #F7931A; } .chip.ln { --c: #7B3FE4; } .chip.nostr { --c: #8E30EB; }
.chip { border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 8%, transparent); }
.chip:hover { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); text-decoration: none; }

</style>
</head>

<header class="top">
	<div class="wrap">
		<a class="brand" href="./"><img src="icon.svg" alt="">Tansu</a>

				<svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
